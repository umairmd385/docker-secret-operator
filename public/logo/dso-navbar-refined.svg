<svg viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg" width="200" height="50">
  <!-- Navbar Logo (Compact, horizontal) -->
  <defs>
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Compact Icon Symbol -->
  <g transform="translate(5, 5)">
    <!-- Minimal container corners -->
    <g fill="none" stroke="#1976D2" stroke-width="1.5" stroke-linecap="round">
      <path d="M 12 2 L 2 2 L 2 12" />
      <path d="M 28 2 L 38 2 L 38 12" />
      <path d="M 38 28 L 38 38 L 28 38" />
      <path d="M 2 28 L 2 38 L 12 38" />
    </g>

    <!-- Drop -->
    <g>
      <ellipse cx="20" cy="12" rx="5" ry="7" fill="url(#dropGradient)" />
      <path d="M 20 19 Q 17 24 20 28 Q 23 24 20 19" fill="#1976D2" />
    </g>

    <!-- Arrow -->
    <g stroke="#1976D2" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="20" y1="30" x2="20" y2="35" />
      <polyline points="17 33 20 35 23 33" />
    </g>
  </g>

  <!-- Compact Text -->
  <g transform="translate(55, 14)">
    <text x="0" y="0" font-family="Inter, Roboto, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1976D2" letter-spacing="-0.3">DSO</text>
  </g>
</svg>