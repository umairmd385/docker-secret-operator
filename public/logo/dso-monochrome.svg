<svg viewBox="0 0 280 120" xmlns="http://www.w3.org/2000/svg" width="280" height="120">
  <!-- Monochrome Version (B&W for print and accessibility) -->
  <defs>
    <filter id="subtleShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Monochrome Symbol Group -->
  <g transform="translate(15, 15)">
    <!-- Container Frame -->
    <g fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round">
      <path d="M 18 2 L 2 2 L 2 18" />
      <path d="M 62 2 L 78 2 L 78 18" />
      <path d="M 78 62 L 78 78 L 62 78" />
      <path d="M 2 62 L 2 78 L 18 78" />
    </g>

    <!-- Drop shape -->
    <g filter="url(#subtleShadow)">
      <ellipse cx="40" cy="28" rx="9" ry="13" fill="#000000" />
      <path d="M 40 41 Q 36 50 40 58 Q 44 50 40 41" fill="#000000" />
    </g>

    <!-- Arrow -->
    <g stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="40" y1="62" x2="40" y2="72" />
      <polyline points="35 67 40 72 45 67" />
    </g>
  </g>

  <!-- Text -->
  <g transform="translate(105, 32)">
    <text x="0" y="0" font-family="Inter, Roboto, system-ui, sans-serif" font-size="32" font-weight="700" fill="#000000" letter-spacing="-0.5">DSO</text>
    <text x="0" y="25" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="600" fill="#333333" letter-spacing="0.8">DOCKER SECRET OPERATOR</text>
  </g>
</svg>
