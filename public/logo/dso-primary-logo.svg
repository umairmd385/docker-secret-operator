<svg viewBox="0 0 280 120" xmlns="http://www.w3.org/2000/svg" width="280" height="120">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Group -->
  <g transform="translate(15, 20)">
    <!-- Container (Docker-style) -->
    <g fill="none" stroke="#1976D2" stroke-width="2.5" stroke-linecap="round">
      <!-- Top-left corner -->
      <path d="M 15 0 L 0 0 L 0 15" />
      <!-- Top-right corner -->
      <path d="M 65 0 L 80 0 L 80 15" />
      <!-- Bottom-right corner -->
      <path d="M 80 65 L 80 80 L 65 80" />
      <!-- Bottom-left corner -->
      <path d="M 0 65 L 0 80 L 15 80" />
    </g>

    <!-- Centered Drop -->
    <ellipse cx="40" cy="30" rx="8" ry="12" fill="url(#dropGradient)" filter="url(#shadow)" />
    <path d="M 40 42 Q 35 52 40 60 Q 45 52 40 42" fill="#1976D2" filter="url(#shadow)" />

    <!-- Left injection arrow (→) -->
    <g stroke="#F44336" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="40" x2="28" y2="40" />
      <polyline points="33 35 28 40 33 45" />
    </g>

    <!-- Right injection arrow (←) -->
    <g stroke="#F44336" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="75" y1="40" x2="52" y2="40" />
      <polyline points="47 35 52 40 47 45" />
    </g>

    <!-- Down flow indicator -->
    <g stroke="#4CAF50" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="40" y1="65" x2="40" y2="75" />
      <polyline points="35 70 40 75 45 70" />
    </g>
  </g>

  <!-- Text Lockup -->
  <g transform="translate(105, 35)">
    <text x="0" y="0" font-family="Roboto, sans-serif" font-size="28" font-weight="700" fill="#1976D2" letter-spacing="-0.5">
      DSO
    </text>
    <text x="0" y="22" font-family="Roboto, sans-serif" font-size="11" font-weight="400" fill="#424242" letter-spacing="0.5">
      DOCKER SECRET OPERATOR
    </text>
  </g>
</svg>
