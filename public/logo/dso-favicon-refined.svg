<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- Favicon Optimized (Ultra-simplified for 16-256px scales) -->
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Minimal Icon (works at all favicon scales) -->
  <g>
    <!-- Container hint (very subtle) -->
    <g fill="none" stroke="#1976D2" stroke-width="1.5" stroke-linecap="round">
      <path d="M 12 8 L 8 8 L 8 12" />
      <path d="M 52 8 L 56 8 L 56 12" />
      <path d="M 56 52 L 56 56 L 52 56" />
      <path d="M 8 52 L 8 56 L 12 56" />
    </g>

    <!-- Drop symbol (core element) -->
    <ellipse cx="32" cy="22" rx="7" ry="10" fill="url(#dropGrad)" />
    <path d="M 32 32 Q 29 38 32 44 Q 35 38 32 32" fill="#1976D2" />

    <!-- Downward arrow (injection flow) -->
    <g stroke="#1976D2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="32" y1="46" x2="32" y2="54" />
      <polyline points="28 50 32 54 36 50" />
    </g>
  </g>
</svg>