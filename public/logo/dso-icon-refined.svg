<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <!-- Define primary colors and effects -->
  <defs>
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <filter id="subtleShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Icon Symbol (1:1 aspect ratio) -->
  <g>
    <!-- Simplified Container Frame -->
    <g fill="none" stroke="#1976D2" stroke-width="2" stroke-linecap="round">
      <!-- Corner brackets (minimal, frame only) -->
      <path d="M 22 8 L 8 8 L 8 22" />
      <path d="M 78 8 L 92 8 L 92 22" />
      <path d="M 92 78 L 92 92 L 78 92" />
      <path d="M 8 78 L 8 92 L 22 92" />
    </g>

    <!-- Centered Secret Drop (Core) -->
    <g filter="url(#subtleShadow)">
      <!-- Drop shape -->
      <ellipse cx="50" cy="35" rx="11" ry="16" fill="url(#dropGradient)" />
      <!-- Injection tail -->
      <path d="M 50 51 Q 45 62 50 70 Q 55 62 50 51" fill="#1976D2" />
    </g>

    <!-- Downward Injection Arrow (Clear flow indicator) -->
    <g stroke="#1976D2" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Arrow shaft -->
      <line x1="50" y1="72" x2="50" y2="82" />
      <!-- Arrow head -->
      <polyline points="44 77 50 82 56 77" />
    </g>
  </g>
</svg>