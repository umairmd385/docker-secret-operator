version: '3.8'

services:
  web-app:
    image: node:18-alpine
    command: ["node", "-e", "console.log('App started. User:', process.env.DB_USER)"]
    environment:
      # We define these variables so Docker knows about them.
      # Their values will be injected securely by DSO in memory.
      - DB_USER
      - DB_PASSWORD
