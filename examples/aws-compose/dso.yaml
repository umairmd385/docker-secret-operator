provider: aws

config:
  region: us-east-2    # Change to your AWS region

agent:
  cache: true
  refresh_interval: 5s

secrets:
  - name: local_secret   # Exact name from AWS Secrets Manager
    inject: env
    mappings:
      MYSQL_ROOT_PASSWORD: MYSQL_ROOT_PASSWORD
      MYSQL_USER: MYSQL_USER
      MYSQL_PASSWORD: MYSQL_PASSWORD
