<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- outer rounded background -->
  <rect width="28" height="28" rx="7" fill="#00c9a7" fill-opacity="0.12" stroke="#00c9a7" stroke-width="1.2"/>
  <!-- left pipe (secret coming in) -->
  <rect x="1" y="12" width="6" height="4" rx="1.5" fill="none" stroke="#00c9a7" stroke-width="1"/>
  <!-- right pipe (injected secret going out) -->
  <rect x="21" y="12" width="6" height="4" rx="1.5" fill="none" stroke="#00c9a7" stroke-width="1"/>
  <!-- central lock body -->
  <rect x="9" y="11" width="10" height="8" rx="2.5" fill="#0d1117" stroke="#00c9a7" stroke-width="1.4"/>
  <!-- shackle (arch above lock) -->
  <path d="M11 11 Q11 6 14 6 Q17 6 17 11" fill="none" stroke="#00c9a7" stroke-width="1.6" stroke-linecap="round"/>
  <!-- keyhole -->
  <circle cx="14" cy="15" r="1.8" fill="#00c9a7"/>
  <rect x="13.3" y="15.5" width="1.4" height="2.5" fill="#00c9a7" rx="0.5"/>
  <!-- small flow dots on left pipe -->
  <circle cx="4" cy="14" r="0.8" fill="#00c9a7" opacity="0.7"/>
  <!-- small flow dots on right pipe -->
  <circle cx="24" cy="14" r="0.8" fill="#00c9a7" opacity="0.7"/>
</svg>
