title: Docker Secret Operator (DSO)
description: >-
  Kubernetes-grade secret management for Docker and Docker Compose — no Kubernetes required.

# just-the-docs via remote_theme (works on GitHub Pages)
remote_theme: just-the-docs/just-the-docs@v0.10.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-github-metadata

# ── just-the-docs configuration ────────────────────────────────────────────────

# Color scheme: "dark" for a professional dark mode, or remove for default light
color_scheme: dark

# Logo shown in the sidebar header
# logo: "/docs/assets/logo.png"

# Favicon
# favicon_ico: "/docs/assets/favicon.ico"

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: order   # sort by nav_order front-matter

# Footer
footer_content: >-
  Docker Secret Operator (DSO) is open source, licensed under the
  <a href="https://github.com/umairmd385/docker-secret-operator/blob/main/LICENSE">MIT License</a>.
  Maintained by <a href="https://github.com/umairmd385">umairmd385</a>.

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Last modified timestamp
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

# GitHub integration (edit on GitHub link)
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/umairmd385/docker-secret-operator"
gh_edit_branch: "main"
gh_edit_source: ""
gh_edit_view_mode: "edit"

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude non-doc files from Jekyll build
exclude:
  - "*.sh"
  - "go.mod"
  - "go.sum"
  - "Makefile"
  - ".github/"
  - "cmd/"
  - "internal/"
  - "pkg/"
  - "plugin/"
  - "test_local_secret/"
  - "vendor/"
