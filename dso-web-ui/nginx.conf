server {
    listen 80;
    server_name localhost;

    # Gzip performance optimizations
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback routing for Single Page Application
    location / {
        try_files $uri $uri/ /index.html;
        
        # Heavy cache on static bundled resources
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public, max-age=15552000, immutable";
        }
    }

    # Proxy Backend APIs to locally running daemon
    # Translates /api/ calls over to the agent running at 8081
    location /api/ {
        proxy_pass http://host.docker.internal:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
